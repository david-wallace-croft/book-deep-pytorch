name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  LIBTORCH_BYPASS_VERSION_CHECK: 1

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config libfontconfig1-dev
      - name: cache
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-torch-${{ hashFiles('Cargo.toml') }}
      - name: clear
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: rm -rf .venv
      - name: setup-python-env
        run: |
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi

          source .venv/bin/activate
          python -m ensurepip --upgrade

          if ! python - <<'PY'
          import importlib.util
          raise SystemExit(0 if importlib.util.find_spec("torch") is not None else 1)
          PY
          then
            python -m pip install torch==2.12.1 torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: environment
        run: |
          source .venv/bin/activate
          TORCH_PATH=$(python -c 'import torch; import os; print(os.path.dirname(torch.__file__))')          
          echo "LIBTORCH=$TORCH_PATH"
          echo "LIBTORCH=$TORCH_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$TORCH_PATH/lib:$LD_LIBRARY_PATH"
          echo "LD_LIBRARY_PATH=$TORCH_PATH/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LIBTORCH_USE_PYTORCH=1"
          echo "LIBTORCH_USE_PYTORCH=1" >> $GITHUB_ENV
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: |
          source .venv/bin/activate
          cargo clippy --all -- -D warnings
      - name: test
        run: |
          source .venv/bin/activate
          # cargo test --workspace --verbose
          cargo test --workspace
